<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSE FIX Gateway Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #e2e8f0;
            --accent-color: #3b82f6;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .status-connected {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }

        .status-disconnected {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--error-color);
        }

        main {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 1rem;
            padding: 1rem;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 0.75rem 1rem;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-container {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .log-entry {
            margin-bottom: 0.25rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-admin-in {
            color: #818cf8;
            border-left: 3px solid #818cf8;
        }

        .log-admin-out {
            color: #c084fc;
            border-left: 3px solid #c084fc;
        }

        .log-app-in {
            color: #4ade80;
            border-left: 3px solid #4ade80;
        }

        .log-app-out {
            color: #fbbf24;
            border-left: 3px solid #fbbf24;
        }

        .form-group {
            margin-bottom: 1rem;
            padding: 1rem;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 0.5rem;
            box-sizing: border-box;
        }

        button {
            background-color: var(--accent-color);
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            border: none;
        }

        button:hover {
            opacity: 0.9;
        }

        .order-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .order-item {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border-color);
            font-size: 0.875rem;
        }

        .order-item h4 {
            margin: 0 0 0.25rem 0;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        .decoded-view {
            margin-top: 0.5rem;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <header>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <i class="fas fa-network-wired fa-lg" style="color: var(--accent-color);"></i>
            <h1 style="margin: 0; font-size: 1.25rem;">BSE FIX Gateway</h1>
        </div>
        <div id="connectionStatus" class="status-badge status-disconnected">
            Disconnected
        </div>
    </header>

    <main>
        <div class="panel">
            <div class="panel-header">
                <span><i class="fas fa-terminal mr-2"></i> Live Message Stream</span>
                <button onclick="clearLogs()"
                    style="width: auto; padding: 0.25rem 0.5rem; font-size: 0.75rem; margin: 0;">Clear</button>
            </div>
            <div id="logContainer" class="log-container">
                <!-- Logs will appear here -->
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="panel" style="flex: 0 0 auto;">
                <div class="panel-header">
                    <span><i class="fas fa-paper-plane mr-2"></i> Quick Order</span>
                </div>
                <div class="form-group" style="padding: 1rem;">
                    <input type="text" id="symbol" placeholder="Symbol (e.g. BTCL)" value="BTCL">
                    <div style="display: flex; gap: 0.5rem;">
                        <select id="side">
                            <option value="1">Buy</option>
                            <option value="2">Sell</option>
                        </select>
                        <select id="ordType">
                            <option value="1">Market</option>
                            <option value="2" selected>Limit</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="number" id="qty" placeholder="Quantity" value="100">
                        <input type="number" id="price" placeholder="Price" value="1.25">
                    </div>
                    <input type="text" id="account" placeholder="Account" value="C001">
                    <button id="sendBtn" onclick="sendOrder()">Send Order</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span><i class="fas fa-list mr-2"></i> Active Orders</span>
                </div>
                <div id="orderList" class="order-list">
                    <!-- Orders will appear here -->
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    <script>
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/fixhub")
            .withAutomaticReconnect()
            .build();

        const logContainer = document.getElementById('logContainer');
        const orderList = document.getElementById('orderList');
        const statusBadge = document.getElementById('connectionStatus');

        connection.on("ReceiveFixMessage", (msg) => {
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + getLogClass(msg.type);

            const timeStr = new Date(msg.timestamp).toLocaleTimeString();

            // Header Info
            entry.innerHTML = `
                <div style="display: flex; justify-content: space-between; cursor: pointer;" onclick="this.nextElementSibling.classList.toggle('hidden')">
                    <span>
                        <span style="color: #64748b; font-size: 0.75rem;">[${timeStr}]</span>
                        <span style="font-weight: 700; margin-left: 0.5rem;">${msg.type.toUpperCase()}</span>
                        <span style="color: var(--accent-color); font-size: 0.75rem; margin-left: 0.5rem;">${msg.msgType}</span>
                    </span>
                    <i class="fas fa-chevron-down" style="font-size: 0.7rem; color: #64748b; margin-top: 4px;"></i>
                </div>
                <div class="decoded-view hidden">
                    <div style="font-size: 0.75rem; color: #94a3b8; font-family: monospace; margin: 0.5rem 0; background: rgba(0,0,0,0.2); padding: 0.5rem; border-radius: 4px; border-left: 2px solid #475569;">
                        ${msg.raw}
                    </div>
                    <table style="width: 100%; font-size: 0.75rem; border-collapse: collapse;">
                        ${msg.decoded.map(f => `
                            <tr>
                                <td style="color: #64748b; padding-right: 1rem; width: 30px;">${f.tag}</td>
                                <td style="color: #94a3b8; padding-right: 1rem;">${f.name}</td>
                                <td style="color: #e2e8f0; word-break: break-all;">${f.value}</td>
                            </tr>
                        `).join('')}
                    </table>
                </div>
            `;

            logContainer.prepend(entry);

            // Limit log entries
            if (logContainer.children.length > 200) {
                logContainer.removeChild(logContainer.lastChild);
            }
        });

        connection.onclose(() => {
            statusBadge.className = 'status-badge status-disconnected';
            statusBadge.innerText = 'Disconnected';
        });

        connection.onreconnecting(() => {
            statusBadge.className = 'status-badge status-disconnected';
            statusBadge.innerText = 'Reconnecting...';
        });

        connection.onreconnected(() => {
            statusBadge.className = 'status-badge status-connected';
            statusBadge.innerText = 'Connected';
        });

        async function start() {
            try {
                await connection.start();
                statusBadge.className = 'status-badge status-connected';
                statusBadge.innerText = 'Connected';
                console.log("SignalR Connected.");
                refreshOrders();
            } catch (err) {
                console.log(err);
                setTimeout(start, 5000);
            }
        };

        function getLogClass(type) {
            if (type === 'FromAdmin') return 'log-admin-in';
            if (type === 'ToAdmin') return 'log-admin-out';
            if (type === 'FromApp') return 'log-app-in';
            if (type === 'ToApp') return 'log-app-out';
            return '';
        }

        function clearLogs() {
            logContainer.innerHTML = '';
        }

        async function sendOrder() {
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            btn.innerText = 'Sending...';

            const payload = {
                symbol: document.getElementById('symbol').value,
                side: document.getElementById('side').value,
                quantity: parseFloat(document.getElementById('qty').value),
                price: parseFloat(document.getElementById('price').value),
                orderType: document.getElementById('ordType').value,
                account: document.getElementById('account').value,
                orderBook: "1"
            };

            try {
                const response = await fetch('/api/Orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log("Order submitted", result);
                    setTimeout(refreshOrders, 1000);
                } else {
                    alert("Error submitting order: " + await response.text());
                }
            } catch (err) {
                alert("Network error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send Order';
            }
        }

        async function refreshOrders() {
            try {
                const response = await fetch('/api/Orders');
                if (response.ok) {
                    const orders = await response.json();
                    orderList.innerHTML = '';
                    Object.entries(orders).forEach(([id, status]) => {
                        const item = document.createElement('div');
                        item.className = 'order-item';
                        item.innerHTML = `<h4>ID: ${id}</h4><div style="color: #94a3b8">${status}</div>`;
                        orderList.prepend(item);
                    });
                }
            } catch (err) {
                console.error("Failed to refresh orders", err);
            }
        }

        start();
        setInterval(refreshOrders, 5000);
    </script>
</body>

</html>
